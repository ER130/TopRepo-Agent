<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TopRepo Agent</title>
<script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e2e5ea;
    --text: #1d2129;
    --muted: #6b7280;
    --user-bubble: #2563eb;
    --user-text: #ffffff;
    --assistant-bubble: #ffffff;
    --system-text: #8a8f98;
    --accent: #2563eb;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  #app {
    max-width: 880px; margin: 0 auto;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    background: var(--panel); flex-shrink: 0;
  }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; }
  header p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }

  #log {
    flex: 1; overflow-y: auto; padding: 20px 20px 8px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.assistant { justify-content: flex-start; }
  .row.system { justify-content: center; }

  .bubble {
    max-width: 78%; padding: 10px 14px; border-radius: 14px;
    line-height: 1.5; font-size: 14.5px; word-wrap: break-word;
  }
  /* pre-wrap only on plain-text bubbles (set via textContent) so a
     user's own manual line breaks survive. The assistant bubble gets
     real HTML from marked.parse() via innerHTML, which always inserts
     literal newlines between block tags (<p>...</p>\n<ul>\n<li>...) --
     pre-wrap there would render each of those as an extra visible line
     break on top of the normal <ul>/<li> layout, which is what produced
     the large blank gaps where a Mode A/B option list should have been
     visible. marked's breaks:true already turns an intentional single
     newline inside a paragraph into <br>, so normal flow is correct. */
  .row.user .bubble, .row.system .bubble { white-space: pre-wrap; }
  .row.user .bubble {
    background: var(--user-bubble); color: var(--user-text);
    border-bottom-right-radius: 4px;
  }
  .row.assistant .bubble {
    background: var(--assistant-bubble); color: var(--text);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .row.system .bubble {
    background: transparent; color: var(--system-text);
    font-size: 12.5px; padding: 2px 10px; max-width: 100%;
  }
  .bubble p:first-child { margin-top: 0; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble table { border-collapse: collapse; margin: 8px 0; font-size: 13px; }
  .bubble th, .bubble td { border: 1px solid var(--border); padding: 4px 8px; }
  .bubble code { background: rgba(0,0,0,0.06); padding: 1px 4px; border-radius: 4px; font-size: 90%; }
  .bubble pre { background: #0f172a; color: #e2e8f0; padding: 10px 12px; border-radius: 8px; overflow-x: auto; }
  .bubble pre code { background: none; color: inherit; padding: 0; }

  .thinking { color: var(--muted); font-size: 13px; font-style: italic; padding: 2px 4px; }
  .thinking::after {
    content: ""; display: inline-block; width: 1em; text-align: left;
    animation: dots 1.2s steps(4, end) infinite;
  }
  @keyframes dots { 0%,20% {content:"";} 40% {content:".";} 60% {content:"..";} 80%,100% {content:"...";} }

  #composer {
    flex-shrink: 0; border-top: 1px solid var(--border);
    background: var(--panel); padding: 12px 16px;
  }
  #uploadNote { font-size: 12px; color: var(--muted); margin: 0 0 6px 2px; min-height: 14px; }
  #inputRow { display: flex; gap: 8px; align-items: flex-end; }
  #attachBtn {
    flex-shrink: 0; width: 38px; height: 38px; border-radius: 10px;
    border: 1px solid var(--border); background: #fff; cursor: pointer;
    font-size: 17px; color: var(--muted);
  }
  #attachBtn:hover { background: #f0f1f3; }
  #textInput {
    flex: 1; resize: none; max-height: 140px; min-height: 38px;
    padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border);
    font-size: 14.5px; font-family: inherit; line-height: 1.4;
  }
  #textInput:focus { outline: none; border-color: var(--accent); }
  #sendBtn {
    flex-shrink: 0; height: 38px; padding: 0 18px; border-radius: 10px;
    border: none; background: var(--accent); color: #fff; font-size: 14px;
    font-weight: 600; cursor: pointer;
  }
  #sendBtn:disabled { background: #b9c3d9; cursor: not-allowed; }
  #fileInput { display: none; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>TopRepo Agent</h1>
    <p>toppic_suite / toprepo_pipeline / ms_process / pdpred_pipeline</p>
  </header>
  <div id="log"></div>
  <div id="composer">
    <div id="uploadNote"></div>
    <div id="inputRow">
      <input type="file" id="fileInput">
      <button id="attachBtn" title="上传文件">📎</button>
      <textarea id="textInput" rows="1" placeholder="输入你的问题,按 Enter 发送(Shift+Enter 换行)"></textarea>
      <button id="sendBtn">发送</button>
    </div>
  </div>
</div>

<script>
const logEl = document.getElementById("log");
const textInput = document.getElementById("textInput");
const sendBtn = document.getElementById("sendBtn");
const attachBtn = document.getElementById("attachBtn");
const fileInput = document.getElementById("fileInput");
const uploadNote = document.getElementById("uploadNote");

const renderedIds = new Set();
let lastId = 0;

function renderMarkdown(text) {
  const html = marked.parse(text, { breaks: true });
  return DOMPurify.sanitize(html);
}

function renderItem(item) {
  if (renderedIds.has(item.id)) return;
  renderedIds.add(item.id);
  if (item.id > lastId) lastId = item.id;

  const row = document.createElement("div");
  row.className = "row " + item.role;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  if (item.role === "assistant") {
    bubble.innerHTML = renderMarkdown(item.text);
  } else {
    bubble.textContent = item.text;
  }
  row.appendChild(bubble);
  logEl.appendChild(row);
  logEl.scrollTop = logEl.scrollHeight;
}

function renderItems(items) {
  for (const item of items) renderItem(item);
}

let thinkingEl = null;
function showThinking() {
  hideThinking();
  const row = document.createElement("div");
  row.className = "row assistant";
  row.innerHTML = '<div class="bubble thinking">正在处理</div>';
  logEl.appendChild(row);
  logEl.scrollTop = logEl.scrollHeight;
  thinkingEl = row;
}
function hideThinking() {
  if (thinkingEl) { thinkingEl.remove(); thinkingEl = null; }
}

async function loadInitial() {
  const res = await fetch("/api/history?since=0&wait=0");
  const data = await res.json();
  renderItems(data.items);
}

async function sendMessage() {
  const text = textInput.value.trim();
  if (!text) return;
  textInput.value = "";
  textInput.style.height = "auto";
  sendBtn.disabled = true;
  showThinking();
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text }),
    });
    hideThinking();
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      renderItem({ id: ++lastId, role: "system", text: "出错了: " + (err.detail || res.status) });
      return;
    }
    const data = await res.json();
    renderItems(data.items);
  } catch (e) {
    hideThinking();
    renderItem({ id: ++lastId, role: "system", text: "网络错误,请检查服务是否还在运行: " + e });
  } finally {
    sendBtn.disabled = false;
    textInput.focus();
  }
}

sendBtn.addEventListener("click", sendMessage);
textInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
textInput.addEventListener("input", () => {
  textInput.style.height = "auto";
  textInput.style.height = Math.min(textInput.scrollHeight, 140) + "px";
});

attachBtn.addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", async () => {
  const file = fileInput.files[0];
  if (!file) return;
  uploadNote.textContent = "正在上传 " + file.name + " ...";
  const form = new FormData();
  form.append("file", file);
  try {
    const res = await fetch("/api/upload", { method: "POST", body: form });
    const data = await res.json();
    if (!res.ok) {
      uploadNote.textContent = "上传失败: " + (data.detail || res.status);
      return;
    }
    renderItems(data.items);
    uploadNote.textContent = "已上传: " + data.path;
  } catch (e) {
    uploadNote.textContent = "上传失败: " + e;
  } finally {
    fileInput.value = "";
  }
});

// Long-poll for anything this client didn't trigger itself (autonomous
// background-task completions, cron firings) -- same dedup path as
// everything else, via renderItem's renderedIds check.
async function pollLoop() {
  while (true) {
    try {
      const res = await fetch("/api/history?since=" + lastId + "&wait=25");
      const data = await res.json();
      renderItems(data.items);
    } catch (e) {
      await new Promise((r) => setTimeout(r, 3000));
    }
  }
}

loadInitial().then(pollLoop);
</script>
</body>
</html>
